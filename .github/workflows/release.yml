name: Release

# Build the signed release APK + AAB and publish them to a GitHub Release.
# Triggered by pushing a version tag (e.g. v0.1.0), or manually.
#
# Requires these repo secrets (same scheme as halo-android / onlytechs):
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   PLAY_SERVICE_ACCOUNT_JSON (optional — enables Play internal-track upload)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to rebuild without moving it
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Record and verify immutable release source
        run: |
          case "$RELEASE_TAG" in v[0-9]*) ;; *) exit 1 ;; esac
          git rev-parse HEAD > release-source.txt
          test "$(cat release-source.txt)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The SDK repo dropped the legacy 'tools' package; the action's default
          # ('tools platform-tools') now fails at `sdkmanager tools` before Gradle runs.
          packages: platform-tools

      - name: Restore signing keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > keystore/pocketshell-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/pocketshell-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build signed APK + AAB
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          # Google Play bundle: Play delivers updates, so -PghtPlay drops the in-app self-install permissions.
          ./gradlew :app:bundleRelease -PghtPlay --no-daemon --stacktrace

      - name: Give release downloads their real version
        run: |
          version="${RELEASE_TAG#v}"
          source_version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "$version" = "$source_version"
          aapt=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt -type f | sort -V | tail -n 1)
          test -x "$aapt"
          "$aapt" dump badging app/build/outputs/apk/release/app-release.apk > apk-badging.txt
          apk_version=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" apk-badging.txt)
          apk_code=$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" apk-badging.txt)
          source_code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)
          test "$apk_version" = "$version"
          test "$apk_code" = "$source_code"
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/pocketshell-${version}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "release-artifacts/pocketshell-${version}.aab"

      - name: Enable KVM for signed upgrade check
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify signed update preserves themes and private app data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu software -feature -Vulkan -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :app:assembleReleaseAndroidTest -PtestBuildType=release --no-daemon --stacktrace
            curl -fLsS https://dl.ght.network/pocketshell.apk -o previous-release.apk
            sed -n 's/.*versionCode = \([0-9]\+\).*/\1/p' app/build.gradle.kts > expected-version-code.txt
            test "$(wc -l < expected-version-code.txt)" -eq 1
            grep -Eq '^[1-9][0-9]*$' expected-version-code.txt
            adb install previous-release.apk
            adb install app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
            adb shell am instrument -w -e class network.ght.pocketshell.ThemeUpgradeTest -e phase prepare -e expectedVersionCode "$(cat expected-version-code.txt)" network.ght.pocketshell.test/androidx.test.runner.AndroidJUnitRunner | tee upgrade-prepare.txt
            grep -q "OK (1 test)" upgrade-prepare.txt
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am instrument -w -e class network.ght.pocketshell.ThemeUpgradeTest -e phase verify -e expectedVersionCode "$(cat expected-version-code.txt)" network.ght.pocketshell.test/androidx.test.runner.AndroidJUnitRunner | tee upgrade-verify.txt
            grep -q "OK (1 test)" upgrade-verify.txt
            adb shell pm grant network.ght.pocketshell android.permission.POST_NOTIFICATIONS
            adb shell am instrument -r -w -e class network.ght.pocketshell.TerminalOutputDrainTest,network.ght.pocketshell.CommandEditorTest,network.ght.pocketshell.SessionActionsUiTest,network.ght.pocketshell.NativeLayoutReviewTest,network.ght.pocketshell.InstalledSessionActionsUiTest network.ght.pocketshell.test/androidx.test.runner.AndroidJUnitRunner | tee signed-runtime-smoke.txt
            grep -q "OK (12 tests)" signed-runtime-smoke.txt
            ! grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_STATUS_CODE: -[234]' signed-runtime-smoke.txt
            grep -q 'POCKETSHELL_REAL_LINUX_NEW_TAB_OK' signed-runtime-smoke.txt
            adb root
            adb wait-for-device
            mkdir -p signed-ui-screenshots
            adb pull /data/data/network.ght.pocketshell/files/screenshots signed-ui-screenshots/

      - name: Retain signed-upgrade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketshell-signed-upgrade-evidence
          path: |
            release-source.txt
            apk-badging.txt
            expected-version-code.txt
            upgrade-prepare.txt
            upgrade-verify.txt
            signed-runtime-smoke.txt
            signed-ui-screenshots
          if-no-files-found: warn

      - name: Retain signed device test APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketshell-signed-device-tests
          path: app/build/outputs/apk/androidTest/release/app-release-androidTest.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Publish only after the signed APK is verified and deployed to DOWNLOAD_URL.
          tag_name: ${{ env.RELEASE_TAG }}
          draft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-rc') }}
          files: |
            release-artifacts/pocketshell-*.apk
            release-artifacts/pocketshell-*.aab

      - name: Publish to Play Store (internal track)
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' && !contains(env.RELEASE_TAG, '-rc') }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: network.ght.pocketshell
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
