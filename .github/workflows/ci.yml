name: CI

# Compile + assemble the debug APK on every push/PR. This is the build gate:
# it proves the Termux terminal engine wires up and the app assembles. The
# unsigned debug APK is uploaded as an artifact for quick on-device testing.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      record_demo:
        description: Record and narrate the verified native command workflow
        type: boolean
        default: false
      render_demo_run:
        description: Existing successful native recording run to narrate without rerunning the app
        type: string
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.render_demo_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Validate shared theme catalog
        run: python3 scripts/generate-themes.py --check

      - name: Prepare real workspace test tools
        run: |
          if ! command -v tmux >/dev/null || ! command -v script >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y tmux util-linux
          fi
          tmux -V
          command -v script

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketshell-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint and unit-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketshell-unit-lint-evidence
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

  instrumented-test:
    if: github.event_name != 'workflow_dispatch' || inputs.render_demo_run == ''
    # Real behavioral gate: spawns an actual TermService + shell on a booted
    # emulator and asserts a command's output round-trips. This is the check
    # that would have caught the lateinit-before-assignment hang before it
    # ever reached a tagged release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run instrumented smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -r -w -e class network.ght.pocketshell.InputPerformanceTest,network.ght.pocketshell.TerminalSmokeTest,network.ght.pocketshell.TerminalInteractionTest,network.ght.pocketshell.StorageRegressionTest,network.ght.pocketshell.TerminalWorkspaceUiTest,network.ght.pocketshell.ThemeWorkspaceUiTest,network.ght.pocketshell.ConnectionLibraryTest,network.ght.pocketshell.TabIsolationTest,network.ght.pocketshell.TabIsolationUiTest,network.ght.pocketshell.TabMenuUiTest,network.ght.pocketshell.ProductAuditTest,network.ght.pocketshell.ReviewedCommandTest,network.ght.pocketshell.CopilotLifecycleTest,network.ght.pocketshell.WorkspacePreferencesUiTest,network.ght.pocketshell.NativeLayoutReviewTest,network.ght.pocketshell.WorkbenchUiTest,network.ght.pocketshell.RemoteWorkspacePersistenceTest,network.ght.pocketshell.RemoteWorkspaceUiTest network.ght.pocketshell.test/androidx.test.runner.AndroidJUnitRunner | tee instrument-output.txt
            adb logcat -d -s System.out:I PocketShell.InputTiming:D > input-timings.txt
            mkdir -p app/build/outputs/theme-screenshots
            adb exec-out run-as network.ght.pocketshell tar cf - -C /data/data/network.ght.pocketshell/files screenshots > app/build/outputs/theme-screenshots.tar
            tar xf app/build/outputs/theme-screenshots.tar -C app/build/outputs/theme-screenshots
            grep -Eq 'OK \([1-9][0-9]* tests?\)' instrument-output.txt
            ! grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_STATUS_CODE: -[234]' instrument-output.txt

      - name: Upload theme and terminal UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketshell-theme-evidence
          path: |
            app/build/outputs/theme-screenshots
            instrument-output.txt
            input-timings.txt
          if-no-files-found: warn

      # Gradle prints only a pass/fail summary, so without this there is no way
      # to tell from a green run which tests actually executed. The XML results
      # name every test method and its outcome.
      - name: Upload instrumentation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketshell-instrumentation-report
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn

  screenshots:
    # Manual-only: walks the app through a few real screens on a booted
    # emulator and uploads what it looked like. UI-coordinate/text automation
    # is more brittle than the smoke test above, so this never gates a push.
    if: github.event_name == 'workflow_dispatch' && inputs.record_demo != true && inputs.render_demo_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            # Not using `gradlew connectedDebugAndroidTest` here: AGP's task
            # uninstalls both APKs the instant the test run finishes, which
            # raced out any attempt to pull files off the device afterward
            # ("run-as: unknown package"). Installing and driving the
            # instrumentation manually keeps the app installed until we're
            # done pulling.
            ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Without this the API 33+ runtime permission dialog covers the app on
            # first launch and every screenshot is a picture of that dialog.
            adb shell pm grant network.ght.pocketshell android.permission.POST_NOTIFICATIONS
            adb shell am instrument -w -e class network.ght.pocketshell.ScreenshotTest network.ght.pocketshell.test/androidx.test.runner.AndroidJUnitRunner | tee instrument-output.txt
            # A single direct `run-as tar` (no `sh -c '... && ...'` wrapper —
            # that combination reliably failed with "No such file or
            # directory" even though the directory demonstrably existed).
            # Writing the tar to /data/local/tmp on-device then failed with
            # "Permission denied" — SELinux blocks an app-uid process from
            # writing there even though it's world-writable by plain DAC
            # permissions. Streaming tar to stdout via `adb exec-out` instead
            # avoids any on-device destination write entirely.
            mkdir -p app/build/outputs/screenshots
            adb exec-out run-as network.ght.pocketshell tar cf - -C /data/data/network.ght.pocketshell/files screenshots > app/build/outputs/screenshots.tar
            tar xf app/build/outputs/screenshots.tar -C app/build/outputs/screenshots
            ls -la app/build/outputs/screenshots
            grep -q "OK (1 test)" instrument-output.txt

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: pocketshell-screenshots
          path: app/build/outputs/screenshots
          if-no-files-found: error

  native-demo:
    if: github.event_name == 'workflow_dispatch' && inputs.record_demo == true && inputs.render_demo_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Prepare native recording
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          bash ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Record verified native workflow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/demo/record.sh
      - name: Narrate recorded outcomes
        run: |
          python3 -m pip install edge-tts==7.3.1
          cp scripts/demo/story.json demo-output/script.json
          python3 scripts/demo/narrate.py demo-output
          python3 scripts/demo/render.py demo-output "${{ github.sha }}"
          python3 scripts/demo/package-review.py demo-output
      - name: Upload original recording and narrated review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketshell-native-demo
          path: demo-output
          if-no-files-found: error

  render-demo:
    if: github.event_name == 'workflow_dispatch' && inputs.render_demo_run != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pocketshell-native-demo
          path: demo-output
          run-id: ${{ inputs.render_demo_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify source and render recorded outcomes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN: ${{ inputs.render_demo_run }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          grep -Eq 'OK \(2 tests?\)' demo-output/instrument-output.txt
          ! grep -Eq 'FAILURES!!!|INSTRUMENTATION_FAILED|INSTRUMENTATION_STATUS_CODE: -[234]' demo-output/instrument-output.txt
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha > demo-output/source-revision.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install edge-tts==7.3.1
          python3 scripts/demo/narrate.py demo-output
          python3 scripts/demo/render.py demo-output "$(cat demo-output/source-revision.txt)"
          python3 scripts/demo/package-review.py demo-output
      - name: Upload narrated native review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocketshell-narrated-review
          path: demo-output
          if-no-files-found: error
